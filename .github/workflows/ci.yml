name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Packages are built with the size-optimized `dist` profile (fat LTO, stripped), with Vulkan
  # and dynamically loaded ggml backends.
  DIST_FEATURES: engine/vulkan,engine/dynamic-backends

jobs:
  linux:
    name: Linux (lint, test, package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev \
            libvulkan-dev glslc spirv-headers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo build --workspace --profile dist --bins --examples --features "$DIST_FEATURES"

      - name: Package
        run: |
          set -euo pipefail
          dist=dist/plamo-translate-desktop
          mkdir -p "$dist"
          cp target/dist/plamo-translate-desktop "$dist/"
          # Newest llama-cpp-sys-2 build output with backend modules.
          out=$(ls -td target/dist/build/llama-cpp-sys-2-*/out | head -n1)
          # The executables need these by SONAME and find them through RUNPATH=$ORIGIN. The
          # build tree holds them as symlinks, so copy the files they point to.
          for lib in libllama.so.0 libggml.so.0 libggml-base.so.0; do
            src=$(find "$out" -name "$lib" | awk '{ print length, $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
            test -n "$src" || { echo "$lib not found"; exit 1; }
            cp -L "$src" "$dist/$lib"
          done
          # Backend modules: Vulkan, plus the same CPU variants as on Windows (see below).
          cp -L "$out/backends/libggml-vulkan.so" "$dist/"
          for variant in x64 haswell skylakex icelake alderlake; do
            cp -L "$out/backends/libggml-cpu-$variant.so" "$dist/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE assets/icon/icon-256.png "$dist/"
          ls -l "$dist"
          # Smoke test with the package's own libraries: the CLI must load llama.cpp and list
          # at least the CPU. The CLI is a development tool and is not shipped.
          cp target/dist/examples/translate "$dist/"
          env -u LD_LIBRARY_PATH "$dist/translate" --list-devices
          rm "$dist/translate"
          tar -C dist -czf plamo-translate-desktop-linux-x86_64.tar.gz plamo-translate-desktop

      - uses: actions/upload-artifact@v7
        with:
          name: plamo-translate-desktop-linux-x86_64
          path: plamo-translate-desktop-linux-x86_64.tar.gz

  windows:
    name: Windows (package)
    runs-on: windows-2025
    env:
      VULKAN_VERSION: 1.4.363.1
      # A short target directory keeps llama.cpp's nested CMake build paths under MAX_PATH.
      CARGO_TARGET_DIR: D:\t
    steps:
      - uses: actions/checkout@v7

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Start-Process -FilePath $installer -Wait -NoNewWindow `
            -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Vulkan SDK was not installed to $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      # The llama-cpp-rs git dependency checks out llama.cpp as a submodule, which contains
      # paths over 230 characters. A short CARGO_HOME keeps them under MAX_PATH.
      - name: Shorten Cargo paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_HOME=D:\c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/cache@v6
        with:
          path: |
            D:\c\registry\index
            D:\c\registry\cache
            D:\c\git\db
            D:\t
          key: windows-dist-${{ env.VULKAN_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-dist-${{ env.VULKAN_VERSION }}-

      # Lints and tests run on Linux: every extra cargo invocation recompiles the GPUI stack,
      # and the workspace has almost no Windows-specific code.
      - run: cargo build --workspace --profile dist --bins --examples --features $env:DIST_FEATURES

      - name: Package
        shell: pwsh
        run: |
          $profile_dir = Join-Path $env:CARGO_TARGET_DIR 'dist'
          $dist = 'dist\plamo-translate-desktop'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$profile_dir\plamo-translate-desktop.exe" $dist
          # Output of the newest llama-cpp-sys-2 build: llama.cpp DLLs and ggml backend modules.
          $out = Get-ChildItem "$profile_dir\build\llama-cpp-sys-2-*\out" -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'backends') } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $out) { throw 'llama-cpp-sys-2 build output not found' }
          # The executables import these three; pick the copy with the shortest path (the
          # install tree rather than the CMake build tree).
          foreach ($dll in 'llama.dll', 'ggml.dll', 'ggml-base.dll') {
            $found = Get-ChildItem $out.FullName -Recurse -Filter $dll |
              Sort-Object { $_.FullName.Length } | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName $dist }
          }
          # Backend modules: Vulkan, plus a subset of the CPU variants. ggml loads the best one the
          # CPU supports. Measured on a Ryzen 9 9950X (2B Q4_K_M): AVX2 and AVX-512 generate at the
          # same speed (memory-bound) and AVX-512 processes prompts ~25% faster; x64 is the slow
          # last resort. sse42/sandybridge (pre-AVX2 CPUs) and cannonlake/cascadelake (covered by
          # skylakex/icelake) are left out.
          Copy-Item "$($out.FullName)\backends\ggml-vulkan.dll" $dist
          foreach ($variant in 'x64', 'haswell', 'skylakex', 'icelake', 'alderlake') {
            Copy-Item "$($out.FullName)\backends\ggml-cpu-$variant.dll" $dist
          }
          foreach ($dll in 'llama.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-vulkan.dll') {
            if (-not (Test-Path (Join-Path $dist $dll))) { throw "$dll is missing from the package" }
          }
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $dist
          Get-ChildItem $dist | Format-Table Name, Length
          # Smoke test with the package's own DLLs: the CLI must load llama.cpp and list at least
          # the CPU. The CLI is a development tool and is not shipped.
          Copy-Item "$profile_dir\examples\translate.exe" $dist
          & "$dist\translate.exe" --list-devices
          if ($LASTEXITCODE -ne 0) { throw "translate.exe failed with exit code $LASTEXITCODE" }
          Remove-Item "$dist\translate.exe"
          Compress-Archive -Path $dist -DestinationPath plamo-translate-desktop-windows-x86_64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: plamo-translate-desktop-windows-x86_64
          path: plamo-translate-desktop-windows-x86_64.zip
