style.plain:
  en: Plain (da/dearu)
  ja: 常体（だ・である）
search.language:
  en: Search languages
  ja: 言語を検索

action.translate:
  en: Translate
  ja: 翻訳
action.swap:
  en: Swap languages
  ja: 言語を入れ替え
action.copy:
  en: Copy
  ja: コピー
