  en: Copied
  ja: コピーしました
action.clear:
  en: Clear
  ja: クリア
action.auto_translate:
  en: Auto
  ja: 自動翻訳

status.loading:
  en: "Loading model… %{percent}%"
  ja: "モデルを読み込み中… %{percent}%"
status.ready:
  en: Ready
  ja: 準備完了
status.translating:
  en: "Translating into %{lang}…"
  ja: "%{lang}に翻訳中…"
status.done:
  en: "Done · %{speed} tok/s"
  ja: "完了 · %{speed} tok/s"
status.cached:
  en: Done (cached)
  ja: 完了（キャッシュ）
status.cancelled:
  en: Cancelled
  ja: キャンセルしました
status.truncated:
  en: The text is too long; the translation was cut off
  ja: テキストが長すぎるため、翻訳が途中で切れました
status.error:
  en: "Error: %{message}"
  ja: "エラー: %{message}"
status.model_missing:
  en: "Model file not found: %{path}"
  ja: "モデルファイルが見つかりません: %{path}"

