[package]
name = "engine"
description = "Translation engine for PLaMo Translate Desktop (llama.cpp backend, models, downloads)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["openmp"]
openmp = ["llama-cpp-2/openmp"]
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]
# Build ggml backends as loadable modules placed next to the executable.
dynamic-backends = ["llama-cpp-2/dynamic-backends", "dep:llama-cpp-sys-2"]

[dependencies]
pfml.workspace = true
llama-cpp-2.workspace = true
# Only for the build output directory of the backend modules (see `Runtime::init`).
llama-cpp-sys-2 = { workspace = true, optional = true }
thiserror.workspace = true
ureq = "3"
sha2 = "0.11"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
anyhow.workspace = true
tracing-subscriber.workspace = true
