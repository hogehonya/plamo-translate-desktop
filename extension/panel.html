<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLaMo Translate</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="20" height="20" alt="" />
      <h1>PLaMo Translate</h1>
      <button id="release" class="small" data-i18n="release" data-i18n-title="releaseTitle"></button>
    </header>
    <div id="status" class="status"></div>

    <details id="settings">
      <summary data-i18n="settings"></summary>
      <label><span data-i18n="model"></span><select id="model"></select></label>
      <label><span data-i18n="device"></span><select id="device"></select></label>
      <label><span data-i18n="pageMode"></span><select id="pageMode"></select></label>
      <p class="hint" data-i18n="settingsHint"></p>
    </details>

    <div class="controls">
      <select id="target" aria-label="target"></select>
      <select id="style" aria-label="style"></select>
      <button id="translate" class="primary" data-i18n="translate"></button>
    </div>

    <textarea id="source" rows="6" data-i18n-placeholder="sourcePlaceholder"></textarea>

    <div class="output-header">
      <span id="progress"></span>
      <span>
        <button id="translatePage" class="small" data-i18n="translatePage" data-i18n-title="translatePageTitle"></button>
        <button id="copy" class="small" data-i18n="copy" disabled></button>
      </span>
    </div>
    <div id="output" class="output" aria-live="polite"></div>

    <div id="notice" class="notice" hidden>
      <span id="noticeText"></span>
      <button id="noticeAction" class="small" hidden></button>
    </div>

    <footer data-i18n="builtWith"></footer>
    <script src="panel.js"></script>
  </body>
</html>
